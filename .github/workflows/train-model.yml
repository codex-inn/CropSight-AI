name: Train CropSight tomato model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs (start with 30)"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt

      - name: Download public tomatOD dataset archive
        run: |
          curl --fail --location --retry 3 --output tomatod-DatasetNinja.tar "https://assets.supervisely.com/remote/eyJsaW5rIjogInMzOi8vc3VwZXJ2aXNlbHktZGF0YXNldHMvMTM0N190b21hdE9EL3RvbWF0b2QtRGF0YXNldE5pbmphLnRhciIsICJzaWciOiAiN2xsb1kwMlQ0VGRWL09kSFRUVW9kbHpscUlhQ3VXNFo5L2haejdRSUR4dz0ifQ==?response-content-disposition=attachment%3B%20filename%3D%22tomatod-DatasetNinja.tar%22"
          test "$(stat -c%s tomatod-DatasetNinja.tar)" -gt 1000000
          mkdir -p raw-dataset
          tar -xf tomatod-DatasetNinja.tar -C raw-dataset

      - name: Convert dataset annotations to YOLO format
        run: |
          python - <<'PY'
          import json, random, shutil
          from pathlib import Path
          from PIL import Image
          random.seed(42)
          root = Path("raw-dataset")
          out = Path("training-data")
          for split in ("train", "val", "test"):
              (out / "images" / split).mkdir(parents=True, exist_ok=True)
              (out / "labels" / split).mkdir(parents=True, exist_ok=True)
          pairs = []
          for ann in root.rglob("*.jpg.json"):
              img = root / str(ann.relative_to(root)).replace("ann/", "img/").removesuffix(".json")
              if img.exists():
                  pairs.append((img, ann))
          if not pairs:
              raise SystemExit("No matching image/annotation pairs found in downloaded dataset.")
          random.shuffle(pairs)
          n = len(pairs)
          train_end = int(n * 0.64)
          val_end = int(n * 0.80)
          splits = {"train": pairs[:train_end], "val": pairs[train_end:val_end], "test": pairs[val_end:]}
          class_ids = {"fully-ripe": 0, "semi-ripe": 1, "unripe": 2}
          for split, items in splits.items():
              for img, ann in items:
                  shutil.copy2(img, out / "images" / split / img.name)
                  data = json.loads(ann.read_text(encoding="utf-8"))
                  w = float(data["size"]["width"])
                  h = float(data["size"]["height"])
                  rows = []
                  for obj in data.get("objects", []):
                      cls = obj.get("classTitle")
                      if cls not in class_ids or obj.get("geometryType") != "rectangle":
                          continue
                      ext = obj["points"]["exterior"]
                      if len(ext) < 2: continue
                      x1,y1 = ext[0]; x2,y2 = ext[1]
                      x1,x2 = sorted((max(0,min(w,float(x1))),max(0,min(w,float(x2)))))
                      y1,y2 = sorted((max(0,min(h,float(y1))),max(0,min(h,float(y2)))))
                      bw,bh = (x2-x1)/w,(y2-y1)/h
                      if bw <= 0 or bh <= 0: continue
                      xc,yc = (x1+x2)/(2*w),(y1+y2)/(2*h)
                      rows.append(f"{class_ids[cls]} {xc:.6f} {yc:.6f} {bw:.6f} {bh:.6f}")
                  (out / "labels" / split / f"{img.stem}.txt").write_text("\n".join(rows), encoding="utf-8")
              print(f"{split}: {len(items)} images")
          (out / "dataset.yaml").write_text(
              f"path: {out.resolve().as_posix()}\ntrain: images/train\nval: images/val\ntest: images/test\nnames:\n  0: harvest_ready\n  1: nearly_ready\n  2: developing\n",
              encoding="utf-8")
          (out / "LICENSE.txt").write_text(
              "Source dataset: tomatOD / DatasetNinja. License: CC BY-NC-SA 4.0.\n"
              "Attribution: Tsironis V., Bourou S., Stentoumis C. (2020), tomatOD.\n"
              "Non-commercial use only; share adaptations under the same license.\n"
              "Ripeness classes are a proxy for harvest readiness.\n", encoding="utf-8")
          PY

      - name: Train YOLO model
        env:
          EPOCHS: ${{ inputs.epochs }}
        run: |
          python - <<'PY'
          import os
          n = int(os.environ["EPOCHS"])
          if n < 1 or n > 150:
              raise SystemExit("Epochs must be between 1 and 150.")
          PY
          python api/train.py --data training-data/dataset.yaml --epochs "${EPOCHS}" --imgsz 640 --batch 4

      - name: Evaluate trained model and package output
        run: |
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO
          import shutil
          runs = Path("runs/cropsight/tomato-maturity")
          weights = runs / "weights" / "best.pt"
          if not weights.is_file():
              raise SystemExit(f"Training did not produce {weights}")
          model = YOLO(str(weights))
          metrics = model.val(data="training-data/dataset.yaml", split="val", imgsz=640, device="cpu")
          out = Path("model-output")
          out.mkdir(exist_ok=True)
          shutil.copy2(weights, out / "best.pt")
          if (runs / "results.csv").exists():
              shutil.copy2(runs / "results.csv", out / "results.csv")
          (out / "MODEL_NOTES.txt").write_text(
              "CropSight AI tomato maturity model.\n"
              "Class IDs: 0=harvest_ready, 1=nearly_ready, 2=developing.\n"
              "Dataset: tomatOD, CC BY-NC-SA 4.0. Non-commercial use only.\n"
              "Ripeness classes are only a proxy for harvest readiness.\n"
              "Not deployed automatically; validate on independent field images.\n"
              f"Validation metrics: {metrics.results_dict}\n", encoding="utf-8")
          print("Validation metrics:", metrics.results_dict)
          PY

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: cropsight-tomato-model
          path: model-output/
          if-no-files-found: error
          retention-days: 14
